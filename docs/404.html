<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Songfy — Buka atau Download Aplikasi</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: #151923;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f5f7fb;
      --muted: #9aa4b8;
      --accent: #ff4d6d;
      --accent-hover: #ff3358;
      --secondary: #222836;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #1d1628 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 77, 109, 0.14);
      color: #ff8fa3;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    a.btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }
    .btn-ghost:hover { color: var(--text); text-decoration: underline; }
    .hint {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge" id="kind-badge">SONGFY MUSIC</span>
    <h1 id="title">Dengarkan di Songfy</h1>
    <p id="subtitle">Download aplikasi Songfy untuk memutar lagu ini langsung, atau buka aplikasi jika sudah terpasang di HP kamu.</p>
    <div class="actions">
      <a class="btn btn-primary" id="download-btn" href="https://github.com/Rasya457/Songfy/releases/latest">Download Songfy APK</a>
      <a class="btn btn-secondary" id="open-app-btn" href="songfy://open">Sudah punya? Buka di Songfy</a>
      <a class="btn-ghost" id="ytm-fallback" href="https://music.youtube.com" rel="noopener">Putar lewat YouTube Music</a>
    </div>
    <p class="hint">Android · Gratis &amp; Tanpa Login</p>
  </main>

  <script>
    (function () {
      var rawPath = window.location.pathname || "/";
      var search = window.location.search || "";
      var normalizedPath = rawPath.replace(/^\/Songfy(?=\/|$)/i, "") || "/";
      var params = new URLSearchParams(search);

      var badge = document.getElementById("kind-badge");
      var title = document.getElementById("title");
      var subtitle = document.getElementById("subtitle");
      var openBtn = document.getElementById("open-app-btn");
      var ytmFallback = document.getElementById("ytm-fallback");

      var cleanPath = normalizedPath.replace(/^\/+/, "");
      if (cleanPath) {
        openBtn.href = "songfy://open/" + cleanPath + search;
        ytmFallback.href = "https://music.youtube.com/" + cleanPath + search;
      } else {
        openBtn.href = "songfy://open";
        ytmFallback.style.display = "none";
      }

      if (normalizedPath.indexOf("/watch") === 0 && params.get("v")) {
        badge.textContent = "LAGU DIBAGIKAN";
        title.textContent = "Putar lagu ini di Songfy";
        subtitle.textContent = "Belum punya aplikasinya? Unduh APK Songfy terlebih dahulu, lalu buka tautan ini lagi.";
      } else if (normalizedPath.indexOf("/playlist") === 0 && params.get("list")) {
        badge.textContent = "PLAYLIST / ALBUM";
        title.textContent = "Buka playlist di Songfy";
      } else if (normalizedPath.indexOf("/channel") === 0 || normalizedPath.indexOf("/c/") === 0) {
        badge.textContent = "ARTIS";
        title.textContent = "Lihat artis di Songfy";
      } else if (normalizedPath.indexOf("/listen") === 0) {
        badge.textContent = "LISTEN TOGETHER";
        title.textContent = "Gabung ruang dengar bareng";
        ytmFallback.style.display = "none";
      }
    })();
  </script>
</body>
</html>
